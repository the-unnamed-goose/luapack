[package]
name = "luapack"
license = "MPLv2"
version = "0.1.0"
edition = "2024"
categories = ["compression", "encoding"]
keywords = ["pack", "bundle", "minify", "lua"]
repository = "https://github.com/repetitive-contrarian/luapack/tree/master"
description = "A basic rust application for efficiently bundling Lua scripts into monolithic releases."

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive"] }
full_moon = { version = "2.0.0", features = ["luau"] }
lz4_flex = { version = "0.12.0", optional = true}
regex = "1.12.2"

[features]
cache = [] # Cache module return values if available, can improve the performance of packed projects by a slight margin but can also cause issues.
lz4 = ["dep:lz4_flex"]
